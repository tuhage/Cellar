name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    # The Xcode that builds releases; Xcode 26.6's compiler crashes on SettingsView.
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Test CellarCore
        working-directory: CellarCore
        run: swift test

      - name: Build all app targets
        run: >-
          xcodebuild
          -project Cellar.xcodeproj
          -scheme Cellar
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
